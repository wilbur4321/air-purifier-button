esphome:
  name: air-purifier-button
  friendly_name: Air Purifier Button
  on_boot:
    priority: 600
    then:
      - output.turn_on: backlight_output

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

# Native Home Assistant integration - no manual MQTT discovery payload needed,
# HA auto-discovers this device and its entities once the ESPHome integration
# is added (Settings -> Devices & Services -> ESPHome).
api:

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Display SPI bus (ILI9341): MISO12 MOSI13 SCLK14 CS15 DC2, no reset pin.
spi:
  - id: display_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  # Touch controller is on its own SPI bus, not shared with the display.
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: gpio
    pin: GPIO21
    id: backlight_output

# Source PNGs are read straight from assets/ and converted to RGB565 at
# compile time - the tools/convert_image.py step from the PlatformIO build
# isn't needed here.
image:
  - platform: file
    file: "../assets/off.png"
    id: off_image
    type: RGB565
    resize: 320x240
  - platform: file
    file: "../assets/on.png"
    id: on_image
    type: RGB565
    resize: 320x240

display:
  - platform: ili9xxx
    model: ILI9341
    id: my_display
    spi_id: display_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 90
    invert_colors: false
    update_interval: never
    # This board has no PSRAM, so a full 16-bit 320x240 framebuffer (150KB)
    # doesn't fit as one contiguous block and setup() fails with "display is
    # marked FAILED: unspecified". 8-bit halves the buffer to 75KB.
    color_palette: 8BIT
    lambda: |-
      // Source images aren't exactly 4:3, so "resize" letterboxes them
      // (contain, not cover) rather than filling the screen. Clear first
      // so old pixels don't linger, then center whichever image is active.
      it.fill(Color::BLACK);
      image::Image *img = id(air_purifier_button).state ? id(on_image) : id(off_image);
      int x = (it.get_width() - img->get_width()) / 2;
      int y = (it.get_height() - img->get_height()) / 2;
      it.image(x, y, img);

touchscreen:
  platform: xpt2046
  id: my_touchscreen
  spi_id: touch_spi
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 50ms
  # We only care about "was it touched", not where - same as the Arduino
  # firmware's touchscreen.touched() check - so no real coordinate
  # calibration is needed. Full raw range satisfies ESPHome's validation.
  calibration:
    x_min: 0
    x_max: 4095
    y_min: 0
    y_max: 4095
  on_touch:
    - switch.toggle: air_purifier_button

switch:
  - platform: template
    name: "Air Purifier Button"
    id: air_purifier_button
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - component.update: my_display
    turn_off_action:
      - component.update: my_display
